name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only: this workflow checks the repository and writes nothing back to it.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Static checks
        run: python3 scripts/check.py
